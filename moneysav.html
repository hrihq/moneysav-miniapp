<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>MoneySav</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --lav:#F5F2FC; --card:#fff; --ink:#211C38; --mut:#8A86A3; --line:#E3DEF2;
    --pri:#7050D5; --pri-soft:#E7DEF9; --sec:#FFC928;
    --in:#2E9E6B; --out:#E0533D; --glass:rgba(255,255,255,.72);
    --sh:0 8px 24px rgba(80,60,140,.10);
  }
  html[data-theme="dark"]{
    --lav:#14121F; --card:#1E1B2E; --ink:#EFEAFB; --mut:#9A93B5; --line:#2C2842;
    --pri:#9B7BF0; --pri-soft:#2A2144; --glass:rgba(30,27,46,.72);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--lav);color:var(--ink);
    font:15px/1.5 "Poppins",-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x:hidden;
  }
  .app{max-width:460px;margin:0 auto;padding:0 16px 96px}
  header{display:flex;align-items:center;gap:10px;padding:18px 2px 6px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;
    border:0;cursor:pointer}
  header h1{font-size:16px;margin:0;font-weight:600}
  header p{margin:0;font-size:12px;color:var(--mut)}
  .glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(255,255,255,.35);border-radius:22px;box-shadow:var(--sh)}
  html[data-theme="dark"] .glass{border-color:rgba(255,255,255,.08)}
  .balance{margin-top:14px;padding:18px}
  .balance small{color:var(--mut);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
  .balance .amt{font-size:30px;font-weight:700;margin:2px 0 12px;letter-spacing:-.02em}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pill{border-radius:14px;padding:10px 12px;background:var(--pri-soft)}
  .pill .k{font-size:11px;color:var(--mut)}
  .pill .v{font-size:14px;font-weight:600}
  .pill.in .v{color:var(--in)} .pill.out .v{color:var(--out)}
  .card{padding:16px;margin-top:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--mut);font-weight:600;
    letter-spacing:.04em;text-transform:uppercase}
  .chart{display:flex;align-items:flex-end;gap:6px;height:96px}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
  .bar i{width:100%;max-width:22px;border-radius:6px 6px 3px 3px;background:var(--pri);opacity:.85;
    transition:height .3s}
  .bar.neg i{background:var(--out);opacity:.7}
  .bar.cur i{background:var(--sec);opacity:1}
  .bar b{font-size:10px;color:var(--mut);font-weight:500}
  .list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .dot{width:32px;height:32px;border-radius:10px;background:var(--pri-soft);display:grid;
    place-items:center;font-size:15px;flex:none}
  .item .m{flex:1;min-width:0}
  .item .m b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .m small{color:var(--mut);font-size:12px}
  .item .a{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .item .a.in{color:var(--in)} .item .a.out{color:var(--out)}
  .empty{color:var(--mut);font-size:13px;text-align:center;padding:14px 0}
  .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    width:58px;height:58px;border-radius:18px;border:0;background:var(--pri);color:#fff;
    font-size:26px;line-height:1;box-shadow:0 10px 26px rgba(112,80,213,.4);z-index:9}
  .fab:active{transform:scale(.96)}
  .sheet{position:fixed;inset:0;display:none;align-items:flex-end;z-index:20}
  .sheet.on{display:flex}
  .sheet .scrim{position:absolute;inset:0;background:rgba(20,15,40,.45);backdrop-filter:blur(2px)}
  .sheet .panel{position:relative;width:100%;max-width:460px;margin:0 auto;
    border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:up .22s ease-out;max-height:92vh;overflow:auto}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
  .sheet h3{margin:0 0 14px;font-size:16px}
  .seg{display:flex;background:var(--pri-soft);border-radius:12px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:8px;border-radius:10px;
    font:inherit;font-weight:600;font-size:13px}
  .seg button.on{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12)}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px}
  input,select,textarea{width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);
    border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--pri)}
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
  .cat{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;
    font-size:11px;color:var(--ink);background:transparent;font:inherit}
  .cat.on{border-color:var(--pri);background:var(--pri-soft);font-weight:600}
  .cat span{display:block;font-size:18px;margin-bottom:2px}
  .actions{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:600;font-size:15px}
  .btn.ghost{background:var(--pri-soft);color:var(--ink)}
  .btn.pri{background:var(--pri);color:#fff}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);
    background:#241F38;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:30}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{margin-top:14px;text-align:center;font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="avatar" title="Muat ulang data dari bot">?</div>
    <div>
      <h1 id="greet">MoneySav</h1>
      <p id="sub">Catat keuangan harianmu</p>
    </div>
  </header>

  <section class="glass balance">
    <small>Saldo bulan ini</small>
    <div class="amt" id="balance">Rp 0</div>
    <div class="row2">
      <div class="pill in"><div class="k">Pemasukan</div><div class="v" id="income">Rp 0</div></div>
      <div class="pill out"><div class="k">Pengeluaran</div><div class="v" id="expense">Rp 0</div></div>
    </div>
  </section>

  <section class="glass card">
    <h2>6 Bulan Terakhir</h2>
    <div class="chart" id="chart"></div>
  </section>

  <section class="glass card">
    <h2>Transaksi Terbaru</h2>
    <div class="list" id="list"></div>
  </section>
  <div class="foot">Data tersimpan di MoneySav • <span id="meta"></span></div>
</div>

<button class="fab" id="fab" aria-label="Tambah">+</button>

<div class="sheet" id="sheet">
  <div class="scrim" id="scrim"></div>
  <div class="panel glass">
    <div class="grab"></div>
    <h3>Tambah Transaksi</h3>
    <div class="seg">
      <button id="segOut" class="on">Pengeluaran</button>
      <button id="segIn">Pemasukan</button>
    </div>
    <label>Jumlah (Rp)</label>
    <input id="amount" inputmode="numeric" placeholder="0" autocomplete="off">
    <label>Kategori</label>
    <div class="cats" id="cats"></div>
    <label>Catatan</label>
    <input id="note" placeholder="opsional" autocomplete="off">
    <label>Metode</label>
    <select id="method"></select>
    <div class="actions">
      <button class="btn ghost" id="cancel">Batal</button>
      <button class="btn pri" id="save">Simpan</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  const EXP = [
    ["Makanan & Minuman","restaurant","🍜"],["Transportasi","bus","🚌"],["Belanja","shopping_bag","🛍️"],
    ["Tagihan","receipt","🧾"],["Hiburan","movie","🎬"],["Kesehatan","health","💊"],
    ["Pendidikan","school","🎓"],["Rumah Tangga","home","🏠"],["Lainnya","category","📦"]
  ];
  const INC = [
    ["Gaji","work","💼"],["Usaha","store","🏪"],["Investasi","trending_up","📈"],
    ["Hadiah","gift","🎁"],["Lainnya","category","📦"]
  ];
  const METHODS = ["Tunai","Kartu Debit","Kartu Kredit","E-Wallet","Transfer Bank","Lainnya"];
  const MONTHS = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

  let type = "EXPENSE";
  let cat = "Makanan & Minuman";
  let tx = [];
  let six = [];

  const $ = id => document.getElementById(id);
  const rp = n => "Rp " + Math.abs(n).toLocaleString("id-ID");
  const sign = (n,t) => (t==="INCOME"?"+":"-") + rp(n);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function toast(msg){
    const t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 2200);
  }

  function initTheme(){
    const cs = tg && tg.colorScheme ? tg.colorScheme : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = cs;
  }

  function initHeader(){
    const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
    const fn = u && u.first_name ? u.first_name : "Kamu";
    const un = u && u.username ? "@"+u.username : "";
    $("greet").textContent = "Halo, " + fn;
    $("sub").textContent = un || "Catat keuangan harianmu";
    $("avatar").textContent = (u && u.first_name) ? u.first_name.slice(0,1).toUpperCase() : "?";
  }

  function renderCats(){
    const src = type === "EXPENSE" ? EXP : INC;
    if (!src.some(c => c[0] === cat)) cat = src[0][0];
    $("cats").innerHTML = src.map(([name,icon,emoji]) =>
      `<button class="cat ${name===cat?"on":""}" data-cat="${esc(name)}"><span>${emoji}</span>${esc(name)}</button>`).join("");
    [...$("cats").children].forEach(b => b.onclick = () => { cat = b.dataset.cat; renderCats(); });
  }

  function render(){
    const now = new Date();
    const key = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
    let inc = 0, exp = 0;
    tx.filter(t => monthKey(t.date) === key).forEach(t =>
      t.type === "INCOME" ? inc += t.amount : exp += t.amount);
    $("income").textContent = rp(inc);
    $("expense").textContent = rp(exp);
    $("balance").textContent = rp(inc - exp);

    // grafik 6 bulan
    const bars = [];
    for (let i = 5; i >= 0; i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
      let s = 0;
      six.filter(t => monthKey(t.date) === k).forEach(t => s += (t.type==="INCOME"? t.amount : -t.amount));
      bars.push({k, label: MONTHS[d.getMonth()], v: s, cur: i===0});
    }
    const max = Math.max(1, ...bars.map(b => Math.abs(b.v)));
    $("chart").innerHTML = bars.map(b =>
      `<div class="bar ${b.v<0?"neg":""} ${b.cur?"cur":""}" title="${b.label}: ${rp(b.v)}">
        <i style="height:${Math.max(4, Math.abs(b.v)/max*82)}px"></i><b>${b.label}</b></div>`).join("");

    const recent = [...tx].sort((a,b)=>b.date-a.date).slice(0,8);
    const src = type => (type==="EXPENSE"?EXP:INC);
    $("list").innerHTML = recent.length ? recent.map(t => {
      const c = src(t.type).find(x => x[0]===t.category) || ["","","📦"];
      return `<div class="item">
        <div class="dot">${c[2]}</div>
        <div class="m"><b>${esc(t.note || c[0])}</b><small>${esc(t.category)} • ${fmtDate(t.date)}</small></div>
        <div class="a ${t.type==="INCOME"?"in":"out"}">${sign(t.amount,t.type)}</div></div>`;
    }).join("") : `<div class="empty">Belum ada transaksi bulan ini.<br>Tekan + untuk menambah.</div>`;
  }

  const monthKey = ms => { const d=new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
  const fmtDate = ms => new Date(ms).toLocaleDateString("id-ID",{day:"numeric",month:"short"});

  function openSheet(){ $("sheet").classList.add("on"); $("amount").value=""; $("note").value=""; renderCats();
    setTimeout(()=>$("amount").focus(), 120); }
  function closeSheet(){ $("sheet").classList.remove("on"); }

  function collect(){
    const raw = $("amount").value.replace(/[^\d]/g,"");
    const amount = parseInt(raw || "0", 10);
    if (!amount || amount <= 0) return {error:"Jumlah harus lebih dari 0"};
    return {type, amount, category: cat, note: $("note").value.trim(),
            method: $("method").value, date: Date.now()};
  }

  // Mini App dikirim balik ke bot lewat Telegram.WebApp.sendData (maks 4096 byte),
  // lalu Mini App ditutup. Bot yang mencatat transaksi dan mengirim ringkasan.
  // Data dibaca ulang dari store yang dikirim bot, jadi angka yang tampil = angka
  // yang benar-benar tersimpan, bukan tebakan lokal.
  let lastSync = {seq: 0, server: false};

  function save(){
    const p = collect();
    if (p.error){ toast(p.error); return; }
    if (!tg || !tg.initData){ toast("Buka dari Telegram"); return; }
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify(
      {action:"add", ...p, _v:1, _t:Date.now()}))));
    tg.HapticFeedback && tg.HapticFeedback.impactOccurred("medium");
    tg.sendData(payload);
    // sendData menutup Mini App; baris di bawah hanya kalau client masih terbuka.
    tx.push({...p, id: Date.now()});
    render(); closeSheet(); toast("Tersimpan ✓");
  }

  // Sumber angka: transaksi terakhir di sesi ini. Menekan 🔄 di header mengirim
  // initData + permintaan data ke bot; bot membalas di chat dengan angka pasti
  // (Mini App tak bisa menerima pesan bot). Angka di layar = data yang terakhir
  // dikonfirmasi bot, bukan cache lokal semata.
  function sync(){
    const p = {action:"sync", _v:1, _t:Date.now()};
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
    tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
    tg.sendData(payload);
    toast("Minta data ke bot…");
  }

  function wire(){
    $("fab").onclick = openSheet;
    $("scrim").onclick = closeSheet;
    $("cancel").onclick = closeSheet;
    $("save").onclick = save;
    $("segOut").onclick = () => { type="EXPENSE"; $("segOut").classList.add("on"); $("segIn").classList.remove("on"); renderCats(); };
    $("segIn").onclick  = () => { type="INCOME";  $("segIn").classList.add("on"); $("segOut").classList.remove("on"); renderCats(); };
    $("method").innerHTML = METHODS.map(m=>`<option>${m}</option>`).join("");
    document.addEventListener("keydown", e => { if (e.key === "Enter" && $("sheet").classList.contains("on")) save(); });
    $("avatar").onclick = sync;
  }

  function seed(){
    // data contoh supaya layar tidak kosong saat first open; diganti data asli saat tersedia
    const now = Date.now();
    tx = []; six = [];
  }

  function boot(){
    if (!tg){ document.body.innerHTML = "<div class='app'><div class='empty' style='padding-top:40px'>Mini App ini hanya berjalan di dalam Telegram.<br>Buka lewat tombol di chat bot.</div></div>"; return; }
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor("#F5F2FC");
    tg.setBackgroundColor && tg.setBackgroundColor("#F5F2FC");
    initTheme(); initHeader(); wire(); render(); seed();
    $("meta").textContent = "v1.0";
  }
  boot();
})();
</script>
</body>
</html>
